[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-gate"
version = "0.1.0"
description = "渠道访问治理闸门：单写者锁 + 日预算 + 拟人节奏（反风控）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xucunyang" }]
keywords = [
    "rate-limit",
    "anti-bot",
    "crawler-manners",
    "single-writer-lock",
    "human-pace",
    "polite-crawler",
]

[project.scripts]
channel-gate = "channel_gate.gate:main"

[tool.setuptools.packages.find]
where = ["src"]
